name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    name: Lint and unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is what the release workflow builds with; 22 is what the README asks for.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No database and no network: the theme suites read committed files and stub
      # the stored-file layer. Nothing here touches the development data dump.
      - name: Test
        run: npm test
